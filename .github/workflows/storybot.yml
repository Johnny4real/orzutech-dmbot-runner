name: storybot  # ORZUTECH Story bot (Telegram) - one ~5 h 40 min session per run, then it starts the next run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["storybot-kick", ".github/workflows/storybot.yml"]
permissions:
  actions: write
  contents: read
concurrency:
  group: storybot
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orzutech-dmbot-data
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/storybot/run.sh
      - name: Cache cut-out model and browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.cache/ms-playwright
          key: storybot-models-v1
      - name: Install
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "::group::apt ffmpeg"; sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends ffmpeg; echo "::endgroup::"
          echo "pip start $(date +%T)"; pip install --progress-bar off "rembg[cpu]" playwright pillow opencv-python-headless 2>&1 | grep -E "^(Successfully|ERROR)" ; echo "pip done $(date +%T)"
          echo "chromium start $(date +%T)"; sudo -E env "PATH=$PATH" python -m playwright install-deps chromium > /dev/null 2>&1; python -m playwright install chromium 2>&1 | tail -2; echo "chromium done $(date +%T)"
      - name: Run the bot
        env:
          STORYBOT_TOKEN: ${{ secrets.STORYBOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash data/storybot/run.sh
      - name: Start the next session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh run list --repo "${{ github.repository }}" --workflow storybot.yml --status queued --json databaseId --jq length 2>/dev/null)" -gt 0 ] 2>/dev/null; then echo "next session already queued"; exit 0; fi
          for i in 1 2 3 4 5 6 7 8; do
            gh workflow run storybot.yml --repo "${{ github.repository }}" --ref main && exit 0
            echo "dispatch failed (try $i), retrying in 30 s"; sleep 30
          done
          exit 1
