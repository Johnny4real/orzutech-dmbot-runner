name: dmbot  # ORZUTECH DM bot timer
on:
  schedule:
    - cron: "*/5 * * * *"
  push:            # restart signal: the Mac pushes the "kick" file when the cloud chain has stopped
    branches: [main]
    paths: ["kick", ".github/workflows/dmbot.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "leave empty for a normal cycle, or --baseline"
        required: false
        default: ""
permissions:
  actions: write
  contents: read
concurrency:
  group: dmbot
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orzutech-dmbot-data
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: data
      - name: Run one cycle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash data/run.sh ${{ github.event.inputs.mode }}
      - name: Start the next cycle (self-chain, in case the schedule does not fire)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 110
          # another cycle already waiting? then the chain is alive - do not start a second one
          if [ "$(gh run list --repo "${{ github.repository }}" --workflow dmbot.yml --status queued --json databaseId --jq length 2>/dev/null)" -gt 0 ] 2>/dev/null; then echo "next cycle already queued"; exit 0; fi
          for i in 1 2 3 4 5 6 7 8; do
            gh workflow run dmbot.yml --repo "${{ github.repository }}" --ref main && exit 0
            echo "dispatch failed (try $i), retrying in 30 s"; sleep 30
          done
          exit 1
