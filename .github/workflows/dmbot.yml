name: dmbot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "leave empty for a normal cycle, or --baseline"
        required: false
        default: ""
concurrency:
  group: dmbot
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orzutech-dmbot-data
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: data
      - name: Run one cycle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          COMPOSIO_USER_API_KEY: ${{ secrets.COMPOSIO_USER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash data/run.sh ${{ github.event.inputs.mode }}
